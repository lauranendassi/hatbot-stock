; ============================================================
;  Configuration du système de stock WeloobeAI
;  Modifiez uniquement les valeurs à droite du signe "="
; ============================================================

[general]
; Année de travail (sert au nom du fichier Ventes et au filtrage)
annee = 2026
; Nom affiché du magasin (utilisé dans les fichiers et par le bot)
nom_magasin = WeloobeAI - Matériel informatique

[fichiers]
source_produits = Gestion_stock_corrige.xlsx
vendeur = Stocks_vendeur.xlsx
ventes = Ventes_{annee}_Mois.xlsx
achats = Achats_{annee}.xlsx
admin = Stocks_admin.xlsx

[securite]
; Mot de passe d'OUVERTURE du fichier admin (chiffrement AES Excel)
mot_de_passe_admin = weloobe_admin
; Mot de passe de protection des feuilles (empêche de modifier les formules)
mot_de_passe_feuilles = weloobe_protect
; Si un fichier source (produits ou achats) est chiffré dans Excel,
; le script le déchiffre automatiquement avec mot_de_passe_admin.

[vendeurs]
; Liste séparée par des virgules (apparaît dans la liste déroulante)
noms = Vendeur 1, Vendeur 2, Vendeur 3, Vendeur 4, Vendeur 5, Vendeur 6

[saisie]
; Nombre de lignes de saisie préparées dans les fichiers vendeur et achats
lignes_ventes = 5000
lignes_achats = 2000

[neon]
; Chaîne de connexion Neon (PostgreSQL). Laissez vide pour désactiver.
; Exemple : postgresql://user:motdepasse@ep-xxx.eu-central-1.aws.neon.tech/neondb?sslmode=require
database_url =

[negociation]
; Le chatbot peut négocier, sans jamais descendre sous un prix plancher calculé ici
; (sauf si la colonne « Prix minimum (FCFA) » est remplie pour un produit : elle prime).
; Remise maximale sur le prix de vente, en %
remise_max_pourcent = 7
; Marge minimale à garder sur le prix d'achat, en %
marge_min_pourcent = 15

[embeddings]
; Recherche sémantique du bot (RAG). none = recherche plein texte uniquement.
; voyage | openai | none   -> doit être IDENTIQUE à la config du bot sur Render
provider = none
api_key =
model =
dimension = 1024
