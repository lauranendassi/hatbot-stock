<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Assistant Stock — WeloobeAI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #e5ddd5;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    padding: 0;
  }
  .phone {
    width: 100%; max-width: 480px; height: 100vh; max-height: 900px;
    background: #fff; display: flex; flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,.15); overflow: hidden;
  }
  @media (min-width: 520px) { .phone { border-radius: 16px; height: 92vh; } }

  .head {
    background: #1f4e78; color: #fff; padding: 14px 18px;
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; background: #2e75b6;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
  }
  .head h1 { font-size: 15px; font-weight: 700; }
  .head .status { font-size: 12px; opacity: .85; display: flex; align-items: center; gap: 5px; }
  .head .dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }

  .chat {
    flex: 1; overflow-y: auto; padding: 18px 14px;
    display: flex; flex-direction: column; gap: 10px;
    background: linear-gradient(rgba(255,255,255,.4), rgba(255,255,255,.4)),
                repeating-linear-gradient(45deg, #ece5dd 0 2px, #e8dfd4 2px 4px);
  }
  .msg { display: flex; gap: 8px; max-width: 88%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.bot { align-self: flex-start; }
  .bubble {
    padding: 9px 13px; border-radius: 14px; font-size: 14px;
    line-height: 1.45; box-shadow: 0 1px 2px rgba(0,0,0,.08);
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.user .bubble { background: #dcf8c6; border-bottom-right-radius: 4px; }
  .msg.bot .bubble { background: #fff; border-bottom-left-radius: 4px; }
  .time { font-size: 10px; color: #6b7280; text-align: right; margin-top: 3px; }

  .chips {
    display: flex; gap: 6px; flex-wrap: wrap; padding: 8px 14px;
    background: #f8fafc; border-top: 1px solid #e5e7eb; flex-shrink: 0;
  }
  .chip {
    background: #fff; border: 1px solid #e5e7eb; color: #1f4e78;
    padding: 6px 12px; border-radius: 999px; font-size: 12.5px;
    cursor: pointer; font-weight: 500;
  }
  .chip:hover { background: #1f4e78; color: #fff; }

  .inputbar {
    display: flex; gap: 8px; padding: 10px 12px; background: #fff;
    border-top: 1px solid #e5e7eb; flex-shrink: 0;
  }
  .inputbar input {
    flex: 1; padding: 11px 14px; border: 1px solid #e5e7eb;
    border-radius: 999px; font-size: 14px; outline: none; background: #f8fafc;
  }
  .inputbar input:focus { border-color: #2e75b6; background: #fff; }
  .inputbar button {
    width: 44px; height: 44px; border-radius: 50%; border: none;
    background: #1f4e78; color: #fff; font-size: 17px; cursor: pointer;
  }
  .inputbar button:hover { background: #2e75b6; }

  .typing .dots span {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: #94a3b8; margin-right: 3px;
    animation: bounce 1.2s infinite;
  }
  .typing .dots span:nth-child(2) { animation-delay: .15s; }
  .typing .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: .5; }
    30% { transform: translateY(-5px); opacity: 1; }
  }
</style>
</head>
<body>

<div class="phone">
  <header class="head">
    <div class="avatar">🤖</div>
    <div>
      <h1>Assistant Stock</h1>
      <div class="status"><span class="dot"></span> En ligne · WeloobeAI</div>
    </div>
  </header>

  <div class="chat" id="chat"></div>

  <div class="chips" id="chips"></div>

  <div class="inputbar">
    <input id="input" type="text" placeholder="Posez votre question..."
           autocomplete="off" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">➤</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const now = () => new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

function renderMessage(who, text, isTyping = false) {
  const div = document.createElement('div');
  div.className = 'msg ' + who + (isTyping ? ' typing' : '');
  if (isTyping) {
    div.innerHTML = '<div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>';
  } else {
    div.innerHTML = '<div class="bubble">' + escapeHtml(text) +
                    '<div class="time">' + now() + '</div></div>';
  }
  $('chat').appendChild(div);
  $('chat').scrollTop = $('chat').scrollHeight;
  return div;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderChips(list) {
  const defaut = ["Stock MacBook", "Prix Latitude 5420", "Alertes", "Chiffre d'affaires", "Top ventes"];
  const arr = list && list.length ? list : defaut;
  $('chips').innerHTML = arr.map(c =>
    '<button class="chip" onclick="quickSend(\'' + c.replace(/'/g, "\\'") + '\')">' + c + '</button>'
  ).join('');
}

let history = [];

async function quickSend(text) {
  if (!text.trim()) return;

  renderMessage('user', text);
  history.push({ who: 'user', text, ts: now() });

  const typing = renderMessage('bot', '', true);

  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    const data = await r.json();
    typing.remove();
    const txt = data.text || data.error || 'Aucune réponse';
    renderMessage('bot', txt);
    history.push({ who: 'bot', text: txt, ts: now() });
  } catch (e) {
    typing.remove();
    renderMessage('bot', "Erreur de connexion au serveur : " + e.message);
  }
}

function send() {
  const input = $('input');
  const t = input.value.trim();
  if (!t) return;
  input.value = '';
  quickSend(t);
}

async function boot() {
  renderMessage('bot', "👋 Bonjour, je suis l'assistant stock WeloobeAI.\n\nPosez-moi une question sur les produits, le stock, les prix, les alertes ou le chiffre d'affaires.\n\nTapez « aide » pour voir les commandes.");
  renderChips();
  $('input').focus();
}

boot();
</script>
</body>
</html>
